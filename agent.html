<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Live chats · Dotnapps team</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; --bg:#F5F5F7; --panel:#fff; --text:#1D1D1F; --muted:#6E6E73; --line:#D2D2D7; --ink:#000; --on-ink:#fff; --accent:#0071E3; --soft:rgba(0,0,0,.06); --warn:#C93400; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --panel:#1D1D1F; --text:#F5F5F7; --muted:#86868B; --line:#424245; --ink:#F5F5F7; --on-ink:#000; --accent:#2997FF; --soft:rgba(255,255,255,.09); --warn:#FF9F0A; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn { padding: .5rem .95rem; border: 0; border-radius: 999px; background: var(--ink); color: var(--on-ink); cursor: pointer; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .btn.danger { color: var(--warn); border-color: currentColor; background: transparent; }

  #login { max-width: 360px; margin: 18vh auto 0; padding: 0 1rem; }
  #login h1 { font-size: 1.4rem; margin: 0 0 .3rem; }
  #login p { color: var(--muted); margin: 0 0 1rem; }
  #login input { width: 100%; padding: .65rem .8rem; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin-bottom: .7rem; }
  .err { color: var(--warn); min-height: 1.3em; margin: .4rem 0 0; }

  #app { display: none; height: 100%; grid-template-columns: 320px 1fr; }
  body.in #app { display: grid; }
  body.in #login { display: none; }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  aside header, main header { display: flex; align-items: center; gap: .6rem; padding: .8rem 1rem; border-bottom: 1px solid var(--line); }
  aside header h1, main header h2 { margin: 0; font-size: 1rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list { overflow-y: auto; flex: 1; }
  .row { display: block; width: 100%; text-align: left; padding: .75rem 1rem; border: 0; border-bottom: 1px solid var(--soft); background: transparent; cursor: pointer; }
  .row:hover, .row[aria-current="true"] { background: var(--soft); }
  .row b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row small { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { display: inline-block; margin-left: .4rem; padding: 0 .45rem; border-radius: 999px; font-size: .7rem; font-weight: 600; background: var(--warn); color: #fff; vertical-align: middle; }
  .tag.closed { background: var(--muted); }
  .empty { padding: 1.5rem 1rem; color: var(--muted); }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #who { color: var(--muted); font-size: .85rem; }
  #who a { color: var(--accent); }
  #log { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .5rem; }
  .m { max-width: min(70ch, 82%); padding: .5rem .8rem; border-radius: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .m small { display: block; font-size: .7rem; opacity: .65; margin-bottom: .1rem; }
  .m.visitor { align-self: flex-start; background: var(--soft); }
  .m.bot { align-self: flex-start; border: 1px dashed var(--line); color: var(--muted); }
  .m.agent { align-self: flex-end; background: var(--ink); color: var(--on-ink); }
  .m.sys { align-self: center; color: var(--muted); font-size: .8rem; background: none; }
  form { display: flex; gap: .5rem; padding: .8rem 1rem; border-top: 1px solid var(--line); background: var(--panel); }
  form textarea { flex: 1; resize: none; max-height: 140px; padding: .6rem .8rem; border: 1px solid var(--line); border-radius: 14px; background: transparent; }
  #placeholder { margin: auto; color: var(--muted); }
  #back { display: none; }

  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; }
    body.thread aside { display: none; }
    body:not(.thread) main { display: none; }
    #back { display: inline-block; }
  }
</style>
</head>
<body>
<section id="login">
  <h1>Dotnapps live chats</h1>
  <p>Team sign-in. Enter the agent token.</p>
  <form id="loginForm" style="display:block;padding:0;border:0;background:none">
    <label class="vh" for="tok" style="position:absolute;left:-9999px">Agent token</label>
    <input id="tok" type="password" autocomplete="current-password" placeholder="Agent token" required>
    <button class="btn" type="submit">Sign in</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</section>

<div id="app">
  <aside>
    <header><h1>Live chats</h1><button class="btn ghost" id="out" type="button">Sign out</button></header>
    <div id="list" role="list" aria-label="Conversations"></div>
  </aside>
  <main>
    <header>
      <button class="btn ghost" id="back" type="button">&larr; Chats</button>
      <h2 id="title">Select a chat</h2>
      <span id="who"></span>
      <button class="btn danger" id="close" type="button" hidden>End chat</button>
    </header>
    <div id="log" role="log" aria-live="polite"><p id="placeholder">Pick a conversation on the left.</p></div>
    <form id="reply" hidden>
      <label for="text" style="position:absolute;left:-9999px">Your reply</label>
      <textarea id="text" rows="1" maxlength="2000" placeholder="Write a reply… (Enter to send, Shift+Enter for a new line)"></textarea>
      <button class="btn" type="submit" id="send">Send</button>
    </form>
  </main>
</div>

<script>
(function () {
  "use strict";
  var KEY = "dotnapps-agent-token";
  var $ = function (id) { return document.getElementById(id); };
  var token = "", cur = null, next = 0, listT, threadT, lastList = [];
  try { token = sessionStorage.getItem(KEY) || ""; } catch (e) {}

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ Authorization: "Bearer " + token, "Content-Type": "application/json" }, opts.headers || {});
    return fetch("/api/agent" + path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { d._status = r.status; return d; });
    });
  }
  function ago(ts) {
    var s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 60) return "just now";
    if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < 86400) return Math.round(s / 3600) + " h ago";
    return Math.round(s / 86400) + " d ago";
  }
  function el(t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; }

  function signedIn() { document.body.classList.add("in"); loadList(); var h = location.hash.slice(1); if (/^[a-f0-9]{32}$/.test(h)) openChat(h); }
  function signOut() { token = ""; cur = null; clearTimeout(listT); clearTimeout(threadT); try { sessionStorage.removeItem(KEY); } catch (e) {} document.body.classList.remove("in", "thread"); document.title = "Live chats · Dotnapps team"; }

  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    token = $("tok").value.trim();
    $("loginErr").textContent = "";
    api("?view=list").then(function (d) {
      if (d._status === 200) { try { sessionStorage.setItem(KEY, token); } catch (x) {} $("tok").value = ""; signedIn(); }
      else { $("loginErr").textContent = d.error || "Could not sign in."; token = ""; }
    });
  });
  $("out").addEventListener("click", signOut);

  // ---- conversation list ----
  function renderList(chats) {
    var box = $("list"); box.textContent = "";
    if (!chats.length) { box.appendChild(el("p", "empty", "No chats yet. They appear here when a visitor asks for a person.")); }
    chats.forEach(function (c) {
      var b = el("button", "row"); b.type = "button"; b.setAttribute("role", "listitem");
      if (cur === c.id) b.setAttribute("aria-current", "true");
      var n = el("b", null, c.name || c.email || "Visitor");
      if (c.status === "closed") n.appendChild(el("span", "tag closed", "ended"));
      else if (c.needsReply) n.appendChild(el("span", "tag", "needs reply"));
      b.appendChild(n);
      b.appendChild(el("small", null, (c.preview || "") ));
      b.appendChild(el("small", null, ago(c.updated)));
      b.addEventListener("click", function () { openChat(c.id); });
      box.appendChild(b);
    });
    var waiting = chats.filter(function (c) { return c.needsReply; }).length;
    document.title = (waiting ? "(" + waiting + ") " : "") + "Live chats · Dotnapps team";
  }
  function loadList() {
    clearTimeout(listT);
    if (!token) return;
    api("?view=list").then(function (d) {
      if (d._status === 401) return signOut();
      if (d.chats) { lastList = d.chats; renderList(d.chats); }
      listT = setTimeout(loadList, document.hidden ? 15000 : 5000);
    }).catch(function () { listT = setTimeout(loadList, 10000); });
  }

  // ---- thread ----
  function add(m) {
    var b = el("div", "m " + m.f);
    var label = { visitor: "Visitor", bot: "AI assistant", agent: "You" }[m.f];
    if (label) b.appendChild(el("small", null, label + " · " + new Date(m.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })));
    b.appendChild(document.createTextNode(m.t));
    $("log").appendChild(b);
  }
  function openChat(id) {
    cur = id; next = 0;
    document.body.classList.add("thread");
    $("log").textContent = "";
    if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
    renderList(lastList);
    pollThread(true);
  }
  function pollThread(first) {
    clearTimeout(threadT);
    if (!cur) return;
    var id = cur;
    api("?id=" + id + "&after=" + next).then(function (d) {
      if (id !== cur) return;
      if (d._status === 401) return signOut();
      if (d._status === 404) { $("title").textContent = "Chat not found"; $("log").textContent = ""; $("log").appendChild(el("p", "empty", d.error)); $("reply").hidden = true; $("close").hidden = true; return; }
      if (d.meta) {
        var m = d.meta;
        $("title").textContent = m.name || "Visitor";
        var who = $("who"); who.textContent = "";
        var a = el("a", null, m.email); a.href = "mailto:" + m.email; who.appendChild(a);
        if (m.page) who.appendChild(document.createTextNode(" · " + m.page));
        var closed = m.status === "closed";
        $("reply").hidden = closed; $("close").hidden = closed;
        var log = $("log"), stick = first || log.scrollHeight - log.scrollTop - log.clientHeight < 80;
        (d.messages || []).forEach(add);
        next = d.next;
        if (stick) log.scrollTop = log.scrollHeight;
        if (first && !closed) $("text").focus();
      }
      threadT = setTimeout(pollThread, document.hidden ? 10000 : 3000);
    }).catch(function () { threadT = setTimeout(pollThread, 6000); });
  }

  function sendReply() {
    var t = $("text").value.trim();
    if (!t || !cur) return;
    $("send").disabled = true;
    api("", { method: "POST", body: JSON.stringify({ id: cur, text: t }) }).then(function (d) {
      $("send").disabled = false;
      if (d._status === 200) { $("text").value = ""; $("text").style.height = "auto"; pollThread(); loadList(); }
      else alert(d.error || "Could not send.");
    }).catch(function () { $("send").disabled = false; alert("Network error. Try again."); });
  }
  $("reply").addEventListener("submit", function (e) { e.preventDefault(); sendReply(); });
  $("text").addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendReply(); } });
  $("text").addEventListener("input", function () { this.style.height = "auto"; this.style.height = Math.min(this.scrollHeight, 140) + "px"; });
  $("close").addEventListener("click", function () {
    if (!cur || !confirm("End this chat? The visitor goes back to the AI assistant.")) return;
    api("", { method: "POST", body: JSON.stringify({ id: cur, action: "close" }) }).then(function () { pollThread(); loadList(); });
  });
  $("back").addEventListener("click", function () { document.body.classList.remove("thread"); cur = null; history.replaceState(null, "", location.pathname); renderList(lastList); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && token) { loadList(); pollThread(); } });

  if (token) {
    api("?view=list").then(function (d) {
      if (d._status === 200) signedIn();
      else signOut();
    });
  }
  window.addEventListener("hashchange", function () { var h = location.hash.slice(1); if (token && /^[a-f0-9]{32}$/.test(h) && h !== cur) openChat(h); });
})();
</script>
</body>
</html>
