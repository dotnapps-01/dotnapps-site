<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skanor — Contact &amp; demo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FAFAFA;color:#0E0E10;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0E0E10}a:hover{color:#5B45B8}
.mono{font-family:Inter,system-ui,sans-serif}
.disp{font-family:'Inter Tight',Inter,sans-serif;letter-spacing:-0.035em;font-weight:600}
.lbl{font:500 12px/1.4 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#0E0E10}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;box-sizing:border-box;font:500 13px/1 Inter,sans-serif;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;border:1px solid #0E0E10;color:#0E0E10;background:#fff;cursor:pointer}
.btn-p{background:#0E0E10;border-color:#0E0E10;color:#fff}
.x{position:absolute;width:15px;height:15px;font:300 18px/15px Inter,sans-serif;color:#8C8C84;text-align:center;pointer-events:none}
.frame{max-width:1280px;margin:0 auto;border-left:1px solid #E7E7EB;border-right:1px solid #E7E7EB;box-sizing:border-box;position:relative}
.sec{border-bottom:1px solid #E7E7EB;position:relative}
.fl{display:flex;flex-direction:column;gap:6px}
.fl label{font:500 12px Inter,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#3D3D45}
.in{min-height:46px;padding:0 14px;border:1px solid #D6D6DC;background:#fff;font:400 15px Inter,sans-serif;color:#0E0E10;box-sizing:border-box;width:100%}

/* Nexo-style theme */
a{color:#0E0E10}a:hover{color:#3D3D45}
.mono{font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.disp{letter-spacing:-0.045em;font-weight:600}
.btn{border-radius:999px;text-transform:none;letter-spacing:0;font:500 15px/1 Inter,sans-serif}
.btn:hover{background:#F1F1F3;color:#0E0E10}
.btn-p,.btn-d{background:#0E0E10;border-color:#0E0E10;color:#fff}
.btn-p:hover,.btn-d:hover{background:#2A2A30;border-color:#2A2A30;color:#fff}
.lbl{display:inline-flex;align-self:flex-start;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:999px;background:#F1F1F3;color:#0E0E10;text-transform:none;letter-spacing:0;font:500 14px/1.2 Inter,sans-serif}
.lbl::before{content:"";width:22px;height:22px;border-radius:50%;flex:none;background:radial-gradient(circle at 30% 30%,#AFCBFF,#F6B8DA 55%,#CDBDFF)}
.lbl>span:first-child{display:none}
.card{border-radius:16px;overflow:hidden}
.pill{border-radius:999px}
.in{border-radius:12px}
.x{display:none}
.frame{border-left-color:transparent!important;border-right-color:transparent!important}
.sec{border-bottom-color:transparent}
.tab.on{border-bottom-color:#0E0E10}
.k{letter-spacing:.04em}
div[style*="minmax(170px, 1fr)"][style*="border: 1px solid"]{border-radius:16px;overflow:hidden}
.tbl th{letter-spacing:.02em}
</style>
</helmet>
<div style="min-height: 100vh">
<dc-import name="SiteNav" active="contact" hint-size="100%,73px"></dc-import>
<section class="sec">
<div class="frame" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr))">
<span class="x" aria-hidden="true" style="left: -8px; bottom: -8px">+</span><span class="x" aria-hidden="true" style="right: -8px; bottom: -8px">+</span>
<div style="padding: clamp(48px, 6vw, 88px) clamp(20px, 5vw, 64px); border-right: 1px solid #E7E7EB; display: flex; flex-direction: column; gap: 24px">
<span class="lbl">Contact &amp; demo</span>
<h1 class="disp" style="margin: 0; font-size: clamp(40px, 5.4vw, 72px); line-height: 1">See Skanor working on your business.</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3D3D45; max-width: 480px">A 20-minute call. We'll set up your first QR flows live and show you what your customers will see.</p>
<div style="display: flex; flex-direction: column; border-top: 1px solid #E7E7EB; margin-top: 8px">
<sc-for list="{{ways}}" as="w"><div style="display: flex; gap: 16px; padding: 18px 0; border-bottom: 1px solid #E7E7EB; align-items: center"><div style="width: 40px; height: 40px; border: 1px solid #E7E7EB; background: #fff; display: flex; align-items: center; justify-content: center; color: #0E0E10"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="{{w.ic}}"></path></svg></div><div><div class="mono" style="font-size: 11px; color: #6B6B75">{{w.k}}</div><div style="font-size: 15px; font-weight: 600; margin-top: 2px">{{w.v}}</div></div></div></sc-for>
</div>
</div>
<form aria-label="Book a demo" style="padding: clamp(32px, 5vw, 64px); display: flex; flex-direction: column; gap: 18px; background: #fff">
<h2 class="disp" style="margin: 0 0 4px; font-size: 28px">Book a demo</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
<div class="fl"><label for="c1">Full name</label><input id="c1" class="in" type="text" autocomplete="name"></div>
<div class="fl"><label for="c2">WhatsApp number</label><input id="c2" class="in" type="tel" autocomplete="tel" placeholder="+91"></div>
</div>
<div class="fl"><label for="c3">Work email</label><input id="c3" class="in" type="email" autocomplete="email"></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
<div class="fl"><label for="c4">Business type</label><select id="c4" class="in"><option>Retail &amp; shops</option><option>Restaurant / café</option><option>Clinic / hospital</option><option>Real estate</option><option>Manufacturer / D2C</option><option>Other</option></select></div>
<div class="fl"><label for="c5">Number of locations</label><select id="c5" class="in"><option>1</option><option>2–5</option><option>6–20</option><option>20+</option></select></div>
</div>
<fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px"><legend class="mono" style="font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: #3D3D45; margin-bottom: 10px">Interested in</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{ints}}" as="i"><label style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border: 1px solid #E7E7EB; font-size: 13px; cursor: pointer"><input type="checkbox" style="accent-color: #0E0E10">{{i}}</label></sc-for></div>
</fieldset>
<div class="fl"><label for="c6">Anything we should know?</label><textarea id="c6" class="in" rows="4" style="padding: 12px 14px; min-height: 100px; resize: vertical"></textarea></div>
<button type="submit" class="btn btn-p" style="width: 100%">Request demo</button>
<p class="mono" style="margin: 0; font-size: 11px; color: #6B6B75">We reply on WhatsApp within one working day.</p>
</form>
</div>
</section>
<dc-import name="SiteFooter" hint-size="100%,460px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1800}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      ways: [
        { k: 'SALES', v: '[sales@skanor.in]', ic: 'M3 5h18v14H3zM3 7l9 6 9-6' },
        { k: 'WHATSAPP', v: '[+91 00000 00000]', ic: 'M21 12a8 8 0 01-11.6 7.1L3 21l1.9-6.2A8 8 0 1121 12z' },
        { k: 'OFFICE', v: 'BHIVE Workspace, AKR Tech Park, Kudlu Gate, Bengaluru 560068', ic: 'M12 21s-7-6.5-7-12a7 7 0 0114 0c0 5.5-7 12-7 12zM12 11a2 2 0 100-4 2 2 0 000 4z' }
      ],
      ints: ['Reviews', 'Menu / catalogue', 'Loyalty & offers', 'Tickets & assets', 'Attendance', 'Real estate plots', 'Product QR & warranty', 'API / white-label']
    };
  }
}
</script>
</body>
</html>
