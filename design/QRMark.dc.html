<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QR mark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div role="img" aria-label="{{label}}" style="width: {{px}}; height: {{px}}; box-sizing: border-box; padding: {{pad}}; background: {{bg}}; display: grid; grid-template-columns: repeat(25, minmax(0, 1fr)); grid-template-rows: repeat(25, minmax(0, 1fr))">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="625"><div style="background: {{c.bg}}; border-radius: {{c.r}}; transform: scale({{c.s}}); opacity: {{c.o}}"></div></sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":300,"min":40,"max":800},"variant":{"editor":"enum","default":"square","options":["square","dot","halftone"]},"color":{"editor":"color","default":"#0E0E10","options":["#0E0E10","#5B45B8","#FFFFFF"]},"bg":{"editor":"color","default":"transparent"},"seed":{"editor":"int","default":7,"min":1,"max":99},"quiet":{"editor":"boolean","default":false},"$preview":{"width":300,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    const N = 25;
    const size = Number(this.props.size ?? 300);
    const variant = this.props.variant ?? 'square';
    const color = this.props.color ?? '#0E0E10';
    const seed = Number(this.props.seed ?? 7);
    const quiet = this.props.quiet ?? false;
    const rnd = (r, c, k) => { const x = Math.sin(r * 12.9898 + c * 78.233 + (seed + k) * 37.719) * 43758.5453; return x - Math.floor(x); };
    const zones = [[0, 0], [0, N - 7], [N - 7, 0]];
    const finder = (r, c) => {
      for (const z of zones) {
        if (r >= z[0] && r < z[0] + 7 && c >= z[1] && c < z[1] + 7) {
          const lr = r - z[0], lc = c - z[1];
          return (lr === 0 || lr === 6 || lc === 0 || lc === 6 || (lr >= 2 && lr <= 4 && lc >= 2 && lc <= 4)) ? 1 : 0;
        }
      }
      for (const z of zones) {
        if (r >= z[0] - 1 && r <= z[0] + 7 && c >= z[1] - 1 && c <= z[1] + 7) return 0;
      }
      if (r >= 16 && r <= 20 && c >= 16 && c <= 20) {
        const lr = r - 16, lc = c - 16;
        return (lr === 0 || lr === 4 || lc === 0 || lc === 4 || (lr === 2 && lc === 2)) ? 1 : 0;
      }
      if (r === 6 || c === 6) return ((r + c) % 2 === 0) ? 1 : 0;
      return -1;
    };
    const cells = [];
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const f = finder(r, c);
        const isFixed = f !== -1;
        const on = isFixed ? f === 1 : rnd(r, c, 0) > 0.52;
        let s = 1, rad = '0', o = 1, bg = on ? color : 'transparent';
        if (variant === 'dot') {
          rad = isFixed ? '22%' : '50%';
          s = isFixed ? 0.94 : 0.86;
        } else if (variant === 'halftone') {
          const fade = 1 - ((r + c) / (2 * N)) * 0.55;
          if (isFixed) { rad = '18%'; s = 0.92; }
          else if (on) { rad = '50%'; s = Math.max(0.28, (0.45 + rnd(r, c, 3) * 0.55) * fade); }
          else { rad = '50%'; s = 0.18; o = 0.28; bg = color; }
        }
        cells.push({ bg, r: rad, s: String(s), o: String(o) });
      }
    }
    return {
      cells,
      px: size + 'px',
      pad: quiet ? Math.round(size * 0.07) + 'px' : '0px',
      bg: this.props.bg ?? 'transparent',
      label: 'QR code'
    };
  }
}
</script>
</body>
</html>
