<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skanor app — Leads and contacts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&display=swap">
<style>
body{margin:0;background:#FAFAFA;color:#0E0E10;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0E0E10}a:hover{color:#5B45B8}
.mono{font-family:Inter,system-ui,sans-serif}
.disp{font-family:'Inter Tight',Inter,sans-serif;letter-spacing:-0.035em;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;box-sizing:border-box;font:500 12px/1 Inter,sans-serif;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;border:1px solid #0E0E10;color:#0E0E10;background:#fff;cursor:pointer;white-space:nowrap}
.btn-p{background:#0E0E10;border-color:#0E0E10;color:#fff}
.btn-p:hover{background:#5B45B8;color:#fff}
.btn-d{background:#0E0E10;color:#fff}
.card{background:#fff;border:1px solid #E7E7EB;min-width:0}
.ch{padding:14px 18px;border-bottom:1px solid #E7E7EB;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ct{font-size:15px;font-weight:600;margin:0}
.k{font:500 11px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#6B6B75}
.pill{display:inline-block;font:500 10.5px/1.5 Inter,sans-serif;padding:2px 8px;white-space:nowrap}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:12px 18px;border-bottom:1px solid #F1F1F3;text-align:left;font-size:13.5px;white-space:nowrap}
.tbl th{font:500 11px Inter,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#6B6B75;background:#F6F6F8}
.in{min-height:40px;padding:0 12px;border:1px solid #E7E7EB;background:#fff;font:400 14px Inter,sans-serif;color:#0E0E10;box-sizing:border-box;width:100%}
.fl{display:flex;flex-direction:column;gap:6px}
.fl label,.fl .lb{font:500 11px Inter,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#3D3D45}
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid #E7E7EB;background:#fff}
.tab{padding:12px 16px;font-size:13.5px;text-decoration:none;color:#3D3D45;border-bottom:2px solid transparent;min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px}
.tab.on{color:#0E0E10;font-weight:600;border-bottom-color:#0E0E10}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tog{width:36px;height:20px;border-radius:10px;position:relative;flex:none;display:inline-block}
.tog i{position:absolute;top:2px;width:16px;height:16px;border-radius:50%;background:#fff}

/* Nexo-style theme */
a{color:#0E0E10}a:hover{color:#3D3D45}
.mono{font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.disp{letter-spacing:-0.045em;font-weight:600}
.btn{border-radius:999px;text-transform:none;letter-spacing:0;font:500 15px/1 Inter,sans-serif}
.btn:hover{background:#F1F1F3;color:#0E0E10}
.btn-p,.btn-d{background:#0E0E10;border-color:#0E0E10;color:#fff}
.btn-p:hover,.btn-d:hover{background:#2A2A30;border-color:#2A2A30;color:#fff}
.lbl{display:inline-flex;align-self:flex-start;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:999px;background:#F1F1F3;color:#0E0E10;text-transform:none;letter-spacing:0;font:500 14px/1.2 Inter,sans-serif}
.lbl::before{content:"";width:22px;height:22px;border-radius:50%;flex:none;background:radial-gradient(circle at 30% 30%,#AFCBFF,#F6B8DA 55%,#CDBDFF)}
.lbl>span:first-child{display:none}
.card{border-radius:16px;overflow:hidden}
.pill{border-radius:999px}
.in{border-radius:12px}
.x{display:none}
.frame{border-left-color:transparent!important;border-right-color:transparent!important}
.sec{border-bottom-color:transparent}
.tab.on{border-bottom-color:#0E0E10}
.k{letter-spacing:.04em}
div[style*="minmax(170px, 1fr)"][style*="border: 1px solid"]{border-radius:16px;overflow:hidden}
.tbl th{letter-spacing:.02em}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch">
<div style="flex: 1 1 248px; max-width: 100%"><dc-import name="AppSidebar" active="leads" hint-size="100%,1040px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px clamp(16px, 2.4vw, 32px); border-bottom: 1px solid #E7E7EB; background: #FFFFFF">
<div><div class="k">Engage</div><h1 class="disp" style="margin: 2px 0 0; font-size: 24px">Leads &amp; contacts</h1></div>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><button type="button" class="btn">Import contacts</button><button type="button" class="btn">New broadcast</button><button type="button" class="btn btn-p">New form</button></div>
</header>
<nav class="tabs" aria-label="Leads sections" style="padding: 0 clamp(8px, 1.6vw, 20px)"><sc-for list="{{tabs}}" as="t"><a href="#" class="tab {{t.cls}}">{{t.t}} <span class="mono" style="font-size: 11px; color: #6B6B75">{{t.c}}</span></a></sc-for></nav>
<div style="padding: clamp(16px, 2.4vw, 28px) clamp(16px, 2.4vw, 32px); display: flex; flex-direction: column; gap: 20px">
<div style="overflow-x: auto; padding-bottom: 4px">
<div style="display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; min-width: 1140px">
<sc-for list="{{cols}}" as="c">
<section style="background: #F3F3F5; border: 1px solid #E7E7EB; display: flex; flex-direction: column">
<div style="padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid {{c.line}}"><h2 style="margin: 0; font-size: 13px; font-weight: 600">{{c.t}}</h2><span class="mono" style="font-size: 11px; color: #6B6B75">{{c.n}}</span></div>
<div style="padding: 10px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{c.cards}}" as="k"><article class="card" style="padding: 12px; display: flex; flex-direction: column; gap: 8px"><div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 13.5px; font-weight: 600">{{k.n}}</span><span class="mono" style="font-size: 10px; color: #6B6B75">{{k.ago}}</span></div><span style="font-size: 12.5px; color: #3D3D45">{{k.i}}</span><div style="display: flex; gap: 6px; flex-wrap: wrap"><span class="pill" style="background: #F3EEFF; color: #5B45B8">{{k.src}}</span><span class="pill" style="background: #F1F1F3; color: #3D3D45">{{k.own}}</span></div><div style="display: flex; gap: 6px"><button type="button" class="btn" style="min-height: 32px; padding: 0 10px; flex: 1">WhatsApp</button><button type="button" class="btn" style="min-height: 32px; padding: 0 10px; flex: 1">Call</button></div></article></sc-for>
</div>
</section>
</sc-for>
</div>
</div>

<div class="row">
<section class="card" style="flex: 2 1 560px">
<div class="ch"><h2 class="ct">Contacts</h2><div style="display: flex; gap: 6px; flex-wrap: wrap"><label class="sr" for="cs">Search contacts</label><input id="cs" class="in" type="search" placeholder="Search name or number" style="width: 220px; min-height: 34px"><select class="in" aria-label="Segment" style="width: auto; min-height: 34px"><option>All contacts</option><option>Opted in to offers</option><option>Loyalty members</option><option>Inactive 60+ days</option></select></div></div>
<div style="overflow-x: auto"><table class="tbl"><thead><tr><th scope="col"><span class="sr">Select</span></th><th scope="col">Name</th><th scope="col">Phone</th><th scope="col">Source</th><th scope="col">Visits</th><th scope="col">Tags</th><th scope="col">Offers opt-in</th></tr></thead>
<tbody><sc-for list="{{contacts}}" as="c"><tr><td><input type="checkbox" aria-label="Select {{c.n}}" style="accent-color: #0E0E10"></td><td style="font-weight: 600">{{c.n}}</td><td class="mono">{{c.p}}</td><td>{{c.s}}</td><td class="mono">{{c.v}}</td><td><div style="display: flex; gap: 4px"><sc-for list="{{c.tags}}" as="t"><span class="pill" style="background: #F1F1F3; color: #3D3D45">{{t}}</span></sc-for></div></td><td><span class="pill" style="background: {{c.ob}}; color: {{c.of}}">{{c.o}}</span></td></tr></sc-for></tbody></table></div>
</section>
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<section class="card">
<div class="ch"><h2 class="ct">Forms</h2><a href="#" class="mono" style="font-size: 11px">+ NEW</a></div>
<ul style="margin: 0; padding: 0; list-style: none"><sc-for list="{{forms}}" as="f"><li style="padding: 12px 18px; border-bottom: 1px solid #F1F1F3; display: flex; justify-content: space-between; gap: 12px"><div><div style="font-size: 13.5px; font-weight: 600">{{f.t}}</div><div class="mono" style="font-size: 10.5px; color: #6B6B75; margin-top: 2px">{{f.d}}</div></div><span class="mono" style="font-size: 12px">{{f.n}}</span></li></sc-for></ul>
</section>
<section class="card">
<div class="ch"><h2 class="ct">WhatsApp broadcast</h2><span class="pill" style="background: #F3EEFF; color: #5B45B8">DRAFT</span></div>
<div style="padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
<div class="fl"><label for="bc1">Send to</label><select id="bc1" class="in"><option>Opted in to offers · 1,284 contacts</option></select></div>
<div class="fl"><label for="bc2">Message template</label><textarea id="bc2" class="in" rows="4" style="padding: 10px 12px; min-height: 90px">Hi [First name]! Weekend special: 2 filter coffees for ₹99 at Saravana Cafe. Show this message at the counter. Reply STOP to opt out.</textarea></div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap"><span class="mono" style="font-size: 11px; color: #6B6B75">EST. COST [₹ PRICE]</span><div style="display: flex; gap: 6px"><button type="button" class="btn" style="min-height: 34px">Schedule</button><button type="button" class="btn btn-p" style="min-height: 34px">Send</button></div></div>
</div>
</section>
</div>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1550}}'>
class Component extends DCLogic {
  renderVals() {
    const K = (n, i, src, own, ago) => ({ n, i, src, own, ago });
    return {
      tabs: [{ t: 'Pipeline', cls: 'on', c: '38' }, { t: 'Contacts', cls: '', c: '4,210' }, { t: 'Forms', cls: '', c: '5' }, { t: 'Broadcasts', cls: '', c: '12' }, { t: 'Segments', cls: '', c: '6' }],
      cols: [
        { t: 'New', n: '12', line: '#0E0E10', cards: [K('Karthik R.', 'Franchise enquiry · Coimbatore', 'FRANCHISE QR', 'Unassigned', '9m'), K('Lakshmi V.', 'Bulk order for 60 people', 'MENU QR', 'Unassigned', '1h')] },
        { t: 'Contacted', n: '9', line: '#0E0E10', cards: [K('Rahul S.', 'Birthday party booking', 'WEBSITE', 'Meena', '3h'), K('Fathima N.', 'Corporate lunch tie-up', 'LEAD FORM', 'Vikas', '1d')] },
        { t: 'Qualified', n: '7', line: '#0E0E10', cards: [K('Arun K.', 'Franchise — Madurai', 'FRANCHISE QR', 'Vikas', '2d')] },
        { t: 'Won', n: '6', line: '#1F7A4D', cards: [K('Sneha P.', 'Catering · 200 plates', 'MENU QR', 'Ravi', '4d')] },
        { t: 'Lost', n: '4', line: '#9A9AA3', cards: [K('Deepak M.', 'Budget too low', 'WEBSITE', 'Meena', '1w')] }
      ],
      contacts: [
        { n: 'Ananya R.', p: '+91 98xxx xx112', s: 'Review QR', v: '14', tags: ['VIP', 'Loyalty'], o: 'YES', ob: '#E3F2EA', of: '#1F6B45' },
        { n: 'Divya S.', p: '+91 97xxx xx845', s: 'Digital bill', v: '9', tags: ['Loyalty'], o: 'YES', ob: '#E3F2EA', of: '#1F6B45' },
        { n: 'Karthik R.', p: '+91 90xxx xx301', s: 'Lead form', v: '1', tags: ['Lead'], o: 'NO', ob: '#F1F1F3', of: '#3D3D45' },
        { n: 'Mohammed I.', p: '+91 99xxx xx776', s: 'Coupon', v: '3', tags: ['Diwali'], o: 'YES', ob: '#E3F2EA', of: '#1F6B45' },
        { n: 'Gowri T.', p: '+91 94xxx xx028', s: 'Wi-Fi QR', v: '2', tags: ['New'], o: 'NO', ob: '#F1F1F3', of: '#3D3D45' }
      ],
      forms: [{ t: 'Franchise enquiry', d: '6 fields · 2 QR codes', n: '92' }, { t: 'Party & catering booking', d: '5 fields · menu QR', n: '48' }, { t: 'Job application', d: '7 fields · resume upload', n: '31' }]
    };
  }
}
</script>
</body>
</html>
